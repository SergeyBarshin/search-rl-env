# Сбор тренировочных rollout на подготовленном vLLM, без обновления весов.
# Модель, endpoint и renderer должны соответствовать удалённому окружению.
model = "Qwen/Qwen3.5-9B"
push = false
max_concurrent = 1
output_dir = "runs/verifiers-train-rollout"

[env.taskset]
id = "search_rl_env"
require_references = true

[env.agent.harness]
id = "search_rl_env"

[env.agent.runtime]
type = "subprocess"

[env.agent]
network_notice = false
max_turns = 6
max_output_tokens = 4096

[client]
type = "train"
base_url = "http://127.0.0.1:8000"
api_key_var = "TRAIN_API_KEY"
renderer_model_name = "Qwen/Qwen3.5-9B"

[client.renderer]
name = "qwen3.5"

[sampling]
temperature = 0.7
max_tokens = 1024
