[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "search-rl-env"
version = "0.1.0"
description = "Харнесс и среда для обучения поисковых агентов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers==0.4.0",
    "aiohttp>=3.12,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.12.3,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
hydra = ["faiss-cpu>=1.12,<2", "onnxruntime>=1.22,<2", "tokenizers>=0.21,<1", "pyarrow>=18,<25", "fsspec>=2025.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_rl_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
